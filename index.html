<!DOCTYPE html>
<html>
<head>
<style>
	body { font-family: sans-serif; background: #1e3b29; color: #f8fafc; padding: 40px 40px 150px 40px; max-width: 900px; margin: auto; }
	h1 { color: #38bdf8; font-size: 2.5rem; }
	.word-row { display: flex; align-items: center; margin-bottom: 15px; font-size: 1.5rem; }
	.word-row label { width: 320px; font-weight: bold; color: #fde047; }
	.word-row input { font-size: 1.4rem; padding: 8px 12px; border-radius: 6px; border: none; width: 350px; }
	button { font-size: 1.5rem; padding: 14px 28px; background: #22c55e; color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; }
	button:hover { background: #16a34a; }
	#story-screen { display: none; font-size: 2.2rem; line-height: 1.6; }
	.story-line { margin-bottom: 24px; animation: fadeIn 0.4s; }
	.blank { color: #fde047; font-weight: bold; text-decoration: underline; }
	@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
	#menu-container {
		position: fixed;
		top: 10px;
		right: 10px;
		z-index: 1000;
		display: flex;
		flex-direction: column;
		align-items: flex-end;
	}

	#menu-button {
		font-size: 26px;
		background: transparent;
		border: none;
		cursor: pointer;
		padding: 5px 10px;
		color: white;
		margin: 0;
	}

	#story-menu {
		background: #1e3b29;
		padding: 10px;
		border: 1px solid #ccc;
		border-radius: 6px;
		box-shadow: 0 3px 10px rgba(0,0,0,0.2);
		display: flex;
		flex-direction: column;
		align-items: stretch;
		gap: 6px;
	}

	#storyMenu {
		font-size: 16px;
		padding: 6px;
		max-width: 250px;
	}
	
	.story-buttons {
		 display: flex;
		 flex-direction: row;
		 justify-content: space-between;
		 gap: 6px;
	}
	
	.story-option {
		flex: 1;
		/* width: 100%; */
		text-align: left;
		/*padding: 10px;*/
		cursor: pointer;
		border: none;
		border-radius: 4px;
		background: #555;
		font-size: 16px;
		color: #ddd;
	}

	.story-option:hover {
		background: #38bdf8;
	}	
</style>
</head>
<body>

<div id="menu-container">
    <button id="menu-button" onclick="toggleMenu()">☰</button>

    <div id="story-menu" style="display:none;">
        <select id="storyMenu" onchange="changeStory()">
        </select>
		<div class="story-buttons">
			<button class="story-option" onclick="changeStory()">Restart</button>
			<button class="story-option" onclick="nextStory()">Next</button>
		</div>
    </div>
</div>

<div id="setup-screen">
  <h1>Fill in the Words!</h1>
  <div id="inputs"></div>
  <button onclick="startStory()">Start the Story!</button>
</div>

<div id="story-screen">
  <div id="lines-container"></div>
  <button id="next-btn" onclick="showNextLine()">Show Next Line</button>
</div>

<script src="stories.js"></script>

<script>
	// PUT YOUR STORY HERE (One sentence/line per quote, put prompts in [brackets])

	"The Thanksgiving Grinch",

	"The townspeople [verb (past tense)] high and low, but the [noun] was nowhere to be found.",
	'"[Exclamation]!" little Sally [noun] said.',
	"\"We can't have Thanksgiving without a [noun]!\"",
	"Just then, a [adjective] figure appeared.",
	"It was [person in room], the mean old [noun] who lived on top of a [adjective] hill and never came to visit.",
	"\"I took your [adjective] turkey\", he shouted.",
	"\"You [pural noun] are so thankful, but what do you have to be thankful for?\"",
	"\"We have our friends, our families, and our [plural noun]\", said little Sally [noun].",
	"\"Just because <i>you</i> don't have any doesn't mean you should ruin <i>our</i> Thanksgiving, you mean old [noun]!\"",
	"The townspeople cheered, and the grumpy [noun] saw the error of his ways.",
	"He returned the town's turkey and joined the [plural noun] in celebration.",
	"\"Happy Thanksgiving to [plural noun] everywhere!\" little Sally [noun] cheered,",
	"and they all lived [adverb] ever after."
	];*/

	// Load up the menu
	const menu = document.getElementById("storyMenu");

	storyLines.forEach((story, index) => {
		const option = document.createElement("option");
		option.value = index;
		option.textContent = story[0];
		menu.appendChild(option);
	});

	const STORAGE_KEY = "lastMadLibStory";

	// Get the previously visited story
	let lastStory = Number(localStorage.getItem(STORAGE_KEY));

	// Determine which story to open next
	let currentStory;
	let currentLine = 0;
	let parsedLines = [];
	parsedLines.length = 0;

	if (localStorage.getItem(STORAGE_KEY) === null) {
		currentStory = 0;
	} else {
		currentStory = (lastStory + 1) % storyLines.length;
	}

	// Select it in the menu
	menu.value = currentStory;

	// Display the selected story
	loadStory(currentStory);

	// Remember the selection
	localStorage.setItem(STORAGE_KEY, currentStory);

	// If the user selects another story, remember that one
	menu.addEventListener("change", function() {
		currentStory = Number(menu.value);
		localStorage.setItem(STORAGE_KEY, currentStory);
		loadStory(currentStory);
	});

	function loadStory() {
		// Clear old prompts and Story
		document.getElementById("inputs").innerHTML = "";
		document.getElementById("lines-container").innerHTML = "";
		
		const prompts = [];
		parsedLines = storyLines[currentStory].map(line => {
			return line.replace(/\[([^\]]+)\]/g, (_, label) => {
				const id = prompts.length;
				prompts.push(label);
				return `{{${id}}}`;
			});
		});

		const inputsDiv = document.getElementById("inputs");
		prompts.forEach((label, i) => {
		inputsDiv.innerHTML += `
		  <div class="word-row">
			<label>${i + 1}. ${label}:</label>
			<input type="text" id="word-${i}" autocomplete="off">
		  </div>`;
		});

		currentLine = 0;
		window.scrollTo(0,0);
	}
	
	function nextStory() {
		//let current = Number(menu.value);
		//currentStory = (current + 1) % storyLines.length;
		menu.value = (currentStory + 1) % storyLines.length;
		changeStory();
	}
	
	function changeStory() {
		currentStory = Number(menu.value);

		// Remember the selected story
		localStorage.setItem("lastMadLibStory", currentStory);

		// Close the menu
		document.getElementById("story-menu").style.display = "none";
		// Clear old prompts and Story
		//document.getElementById("inputs").innerHTML = "";
		//document.getElementById("lines-container").innerHTML = "";

		// Show setup screen
		document.getElementById("setup-screen").style.display = "block";
		document.getElementById("story-screen").style.display = "none";

		// Reload prompts for the selected story
		loadStory();
	}

	function startStory() {
		document.getElementById("setup-screen").style.display = "none";
		document.getElementById("story-screen").style.display = "block";
	    document.getElementById("next-btn").style.display = "block";
		showNextLine();
	}

	function showNextLine() {
		if (currentLine >= parsedLines.length) return;
		let text = parsedLines[currentLine];
		text = text.replace(/\{\{(\d+)\}\}/g, (_, id) => {
		    const val = document.getElementById(`word-${id}`).value || "___";
		    return `<span class="blank">${val}</span>`;
		});
		const p = document.createElement("div");
		p.className = "story-line";
		p.innerHTML = text;
		document.getElementById("lines-container").appendChild(p);
		currentLine++;
		if (currentLine >= parsedLines.length) {
		    document.getElementById("next-btn").style.display = "none";
		}
		window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
	}
  
	function toggleMenu() {
		const menu = document.getElementById("story-menu");

		if (menu.style.display === "none") {
			menu.style.display = "block";
		} else {
			menu.style.display = "none";
		}
	}  
</script>
</body>
</html>
